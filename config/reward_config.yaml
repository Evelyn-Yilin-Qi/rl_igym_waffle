rewards:
  components:
    - name: "static"
      enabled: true
      weight: 1.0
      params:
        v_thresh: 0.1
        w_thresh: 0.2
        penalty_value: -1.0
    
    - name: "obstacle"
      enabled: true
      weight: 1.0
      params:
        dcol: 0.2
        dcrit: 0.5
        rc: -1.0      # 临界距离惩罚（论文表格：SCLFC_D_R2）
        rcrit: -1.0   # 临界阈值惩罚（论文表格：SCLFC_D_R2）
        rcol: -100.0  # 碰撞惩罚（论文表格：所有模型都是-100）
    
    - name: "heading"
      enabled: true
      weight: 1.0
      params:
        phi_thresh: 0
        rh: -2.8
        rl: -1
    
    - name: "smoothness"
      enabled: true
      weight: 1.0
      params:
        ras1: -0.02
        ras2: -0.02
    
    # 离心力惩罚（预留接口，默认不启用）
    - name: "centrifugal"
      enabled: false  # 暂时不启用
      weight: 1.0
      params:
        mass: 1.373  # TB3机器人质量（kg）
        penalty_type: "linear"  # 'linear', 'threshold', 'quadratic'
        scale: 1.0  # 惩罚系数
        threshold: 0.5  # 离心加速度阈值（m/s²），用于threshold和quadratic模式

# ==================================
# skrl PPO 核心算法配置 (严格对齐论文)
# ==================================
agent:
  rollouts: 8            # Horizon Length
  learning_epochs: 4     # Mini Epochs
  mini_batches: 4        # Mini batches
  learning_rate: 0.0005  # 5e-4 (论文参数)
  entropy_loss_scale: 0.01 # 1e-2 (论文参数)
  value_loss_scale: 0.2
  ratio_clip: 0.2        # eps_clip (论文参数)
  discount_factor: 0.99
  state_preprocessor: null
  value_preprocessor: null

# ==================================
# 训练引擎控制配置
# ==================================
trainer:
  stage1_epochs: 50
  stage2_epochs: 300
  headless: false
